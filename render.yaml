# Render configuration file
services:
  - type: web
    name: hustlentussle
    env: python
    plan: starter  # Starter tier for persistent disk and zero downtime
    buildCommand: pip install -r requirements.prod.txt
    # Runs after build, before the new version goes live (has DATABASE_URL).
    # Applies YTD stats migrations idempotently (CREATE ... IF NOT EXISTS).
    # NOTE: preDeployCommand requires a paid instance type (starter+), not free.
    preDeployCommand: python scripts/migrate.py
    startCommand: gunicorn wsgi:application
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true  # Will generate a random value on first deploy
      - key: DATABASE_URL
        fromDatabase:
          name: hustlentussle-db
          property: connectionString
      - key: GAME_EXPIRATION_SECONDS
        value: "21600"  # 6 hours in seconds
      - key: CLEANUP_INTERVAL_SECONDS
        value: "3600"  # 1 hour in seconds
      - key: PERSISTENCE_FALLBACK_ENABLED
        value: "false"  # In production, fail if database is unavailable
    domains:
      - yourdomain.com  # Replace with your actual domain

databases:
  - name: hustlentussle-db
    plan: free  # Free tier: 1GB storage, 90-day data retention
    databaseName: hustlentussle
    user: hustlentussle 