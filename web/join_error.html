<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Error - Hustle n' Tussle</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Hustle n' Tussle</h1>
            <h2>Join Battle Session</h2>
        </header>

        <div class="error-screen">
            <div class="error-content">
                <h2>Unable to Join Battle</h2>
                <p class="error-message">{{ error }}</p>
                <div class="error-actions">
                    <a href="/" class="btn primary">Go to Home</a>
                    <p class="help-text">
                        Need a new share code? Ask the battle organizer to generate a new one.
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
