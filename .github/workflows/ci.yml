name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, prod]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Check formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python run_complete_test_suite.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  # Browser-level smoke of the core battle flow (scripts/smoke_ui.py) against
  # a live app with the in-memory repository. Advisory: failures don't block
  # the required jobs above, but show up on the PR for investigation.
  ui-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build frontend bundle
        run: npm ci && npm run build
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Install Playwright chromium
        run: playwright install --with-deps chromium
      - name: Start app (in-memory repository)
        run: |
          gunicorn --bind 127.0.0.1:8092 web.app:app &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8092/ && break
            sleep 1
          done
      - name: Run UI smoke
        run: python scripts/smoke_ui.py --base-url http://127.0.0.1:8092
